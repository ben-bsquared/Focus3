<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Quick Preview</title>

    <!-- 1. Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 2. Babel Standalone for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 3. Import Map: This allows copy-pasting code with standard 'import' statements -->
    <script type="importmap">
        {
            "imports": {
                "react": "https://esm.sh/react@18.2.0",
                "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
                "lucide-react": "https://esm.sh/lucide-react@0.344.0"
            }
        }
    </script>
</head>
<body class="bg-slate-100 min-h-screen">
<div id="root"></div>

<!-- 4. Your React Code Goes Here (Note: type="text/babel" and data-type="module") -->
<script type="text/babel" data-type="module">
    import { createRoot } from 'react-dom/client';

import React, { useState, useEffect, useCallback } from 'react';
import { CheckCircle2, Plus, Zap, ListChecks, Trophy, XCircle, Volume2, VolumeX } from 'lucide-react';

const App = () => {
  const [tasks, setTasks] = useState([]);
  const [inputValue, setInputValue] = useState('');
  const [completedCount, setCompletedCount] = useState(0);
  const [showConfetti, setShowConfetti] = useState(false);
  const [soundEnabled, setSoundEnabled] = useState(true);

  const MAX_TASKS = 3;

  const playSuccessSound = useCallback(() => {
    if (!soundEnabled) return;
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      const audioCtx = new AudioContext();
      const playNote = (freq, startTime, duration) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(0.1, startTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(startTime);
        osc.stop(startTime + duration);
      };
      const now = audioCtx.currentTime;
      playNote(1318.51, now, 0.4); 
      playNote(1975.53, now + 0.1, 0.6); 
    } catch (e) {
      console.error("Audio failed", e);
    }
  }, [soundEnabled]);

  const handleAddTask = (e) => {
    e.preventDefault();
    if (inputValue.trim() && tasks.length < MAX_TASKS) {
      const newTask = {
        id: Date.now(),
        text: inputValue.trim(),
        createdAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };
      setTasks([...tasks, newTask]);
      setInputValue('');
      // Dismiss keyboard on mobile by blurring
      document.activeElement instanceof HTMLElement && document.activeElement.blur();
    }
  };

  const completeTask = (id) => {
    setTasks(tasks.filter(t => t.id !== id));
    setCompletedCount(prev => prev + 1);
    playSuccessSound();
    setShowConfetti(true);
    setTimeout(() => setShowConfetti(false), 2000);
  };

  const slotsRemaining = MAX_TASKS - tasks.length;

  return (
    <div className="min-h-screen bg-slate-50 text-slate-900 font-sans selection:bg-indigo-100 flex flex-col items-center overflow-x-hidden">
      {/* Mobile-First Container */}
      <div className="w-full max-w-md px-5 py-6 flex flex-col min-h-screen">
        
        {/* Compact Header */}
        <header className="flex justify-between items-center mb-6">
          <div className="flex items-center gap-3">
            <div className="p-2 bg-indigo-600 rounded-xl shadow-md shadow-indigo-100">
              <Zap className="text-white w-5 h-5" />
            </div>
            <h1 className="text-xl font-extrabold tracking-tight text-slate-800">Focus3</h1>
          </div>
          
          <button 
            onClick={() => setSoundEnabled(!soundEnabled)}
            className="p-3 bg-white rounded-full border border-slate-200 text-slate-400 active:bg-slate-50 active:scale-90 transition-all shadow-sm"
          >
            {soundEnabled ? <Volume2 size={18} /> : <VolumeX size={18} />}
          </button>
        </header>

        {/* Stats - Horizontal Bar */}
        <div className="flex gap-3 mb-6">
          <div className="flex-1 bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex flex-col items-center">
            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Slots</span>
            <span className={`text-xl font-black ${slotsRemaining === 0 ? 'text-rose-500' : 'text-indigo-600'}`}>
              {slotsRemaining} / {MAX_TASKS}
            </span>
          </div>
          <div className="flex-1 bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex flex-col items-center">
            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Done</span>
            <span className="text-xl font-black text-emerald-600">{completedCount}</span>
          </div>
        </div>

        {/* Input Section */}
        <div className="mb-8">
          {tasks.length < MAX_TASKS ? (
            <form onSubmit={handleAddTask} className="relative group">
              <input
                type="text"
                value={inputValue}
                onChange={(e) => setInputValue(e.target.value)}
                placeholder="Next big thing..."
                className="w-full p-4 pr-16 bg-white border-2 border-slate-100 rounded-2xl focus:outline-none focus:border-indigo-500 transition-all shadow-sm text-base md:text-lg appearance-none"
                style={{ fontSize: '16px' }} // Prevents auto-zoom on mobile safari
              />
              <button
                type="submit"
                disabled={!inputValue.trim()}
                className="absolute right-2 top-2 bottom-2 px-4 bg-indigo-600 text-white rounded-xl disabled:opacity-20 active:scale-95 transition-transform flex items-center justify-center"
              >
                <Plus size={24} strokeWidth={3} />
              </button>
            </form>
          ) : (
            <div className="bg-rose-50 border border-rose-100 p-4 rounded-2xl flex items-center gap-3 text-rose-700 animate-pulse">
              <XCircle size={20} className="shrink-0" />
              <p className="text-xs font-bold uppercase tracking-tight">Full. Finish one to unlock.</p>
            </div>
          )}
        </div>

        {/* Task List - The Core Focus */}
        <div className="flex-1 space-y-3">
          <div className="flex justify-between items-center px-1 mb-2">
            <h2 className="text-[11px] font-bold text-slate-400 uppercase tracking-widest">Current Stack</h2>
          </div>
          
          {tasks.length === 0 ? (
            <div className="flex flex-col items-center justify-center py-12 bg-slate-50/50 border-2 border-dashed border-slate-200 rounded-3xl opacity-60">
              <ListChecks className="text-slate-300 mb-3" size={40} />
              <p className="text-sm font-medium text-slate-400">Your stack is empty.</p>
            </div>
          ) : (
            tasks.map((task) => (
              <div 
                key={task.id} 
                className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between animate-in slide-in-from-top-2 duration-300"
              >
                <div className="flex-1 pr-4 overflow-hidden">
                  <p className="text-base font-semibold text-slate-800 break-words leading-tight">{task.text}</p>
                  <p className="text-[9px] font-bold text-slate-300 mt-1 uppercase tracking-tighter">Added {task.createdAt}</p>
                </div>
                <button
                  onClick={() => completeTask(task.id)}
                  className="shrink-0 w-12 h-12 flex items-center justify-center bg-emerald-50 text-emerald-600 rounded-xl active:bg-emerald-100 active:scale-90 transition-all border border-emerald-100"
                >
                  <CheckCircle2 size={24} strokeWidth={2.5} />
                </button>
              </div>
            ))
          )}
        </div>

        {/* Footer/Motivation */}
        {completedCount > 0 && (
          <footer className="mt-8 pt-6 border-t border-slate-100 text-center">
            <div className={`transition-all duration-500 ${showConfetti ? 'scale-125' : 'scale-100'}`}>
              <Trophy className={`mx-auto mb-2 ${showConfetti ? 'text-amber-400' : 'text-slate-200'}`} size={24} />
            </div>
            <p className="text-slate-400 text-[11px] font-medium leading-relaxed px-6">
              "Focus is saying 'no' to 1,000 good ideas."
            </p>
          </footer>
        )}
      </div>
    </div>
  );
};

export default App;

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
